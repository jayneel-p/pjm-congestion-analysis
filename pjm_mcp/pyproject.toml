[project]
name = "pjm-api-mcp"
version = "0.1.1"
description = "A read-only MCP server for the PJM Data Miner API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1", "pydantic>=2.12,<3"]

[project.scripts]
pjm-mcp = "pjm_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pjm_mcp"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
